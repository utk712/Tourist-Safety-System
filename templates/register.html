{% extends "base.html" %}

{% block title %}Tourist Registration - SafeGuard AI{% endblock %}

{% block content %}
<div style="max-width: 580px; margin: 1.5rem auto;">
    <div style="margin-bottom: 2rem;">
        <div class="badge badge-info" style="margin-bottom: 12px;"><i class="fa-solid fa-user-plus"></i> Secure Registration</div>
        <h1 class="page-title">Tourist Registration</h1>
        <p class="page-subtitle">Register your details securely to enable instant SOS alerts and local authority assistance.</p>
    </div>

    <div class="glass-card">
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="name"><i class="fa-solid fa-user"></i> Full Name</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="e.g. Priya Sharma" required>
            </div>

            <div class="grid-2" style="grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="form-group">
                    <label class="form-label" for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="phone"><i class="fa-solid fa-phone"></i> Phone Number</label>
                    <input type="text" class="form-control" id="phone" name="phone" placeholder="+91 98765 43210" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="country"><i class="fa-solid fa-globe"></i> Country of Residence / Origin</label>
                <input type="text" class="form-control" id="country" name="country" placeholder="e.g. United Kingdom" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.9rem; font-size: 1rem; font-family: var(--font-heading);">
                <i class="fa-solid fa-check"></i> Complete Registration
            </button>
        </form>
    </div>
</div>
{% endblock %}
