<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tourist Registration</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0f1e; --surface: #111827; --surface2: #1a2235;
  --border: rgba(255,255,255,0.07); --border-md: rgba(255,255,255,0.13);
  --text: #f0f4ff; --muted: #7a8aaa;
  --accent-b: #3b82f6; --accent-t: #06b6d4;
  --radius: 12px; --radius-lg: 18px;
  --font-head: 'Syne', sans-serif; --font-body: 'DM Sans', sans-serif;
}
html, body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; }

nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1rem 2rem; border-bottom: 1px solid var(--border);
  background: rgba(10,15,30,0.9); backdrop-filter: blur(12px);
  position: sticky; top: 0; z-index: 100;
}
.brand { font-family: var(--font-head); font-weight: 800; font-size: 1.05rem; }
.brand span { color: var(--accent-b); }
.back-link { font-size: 13px; color: var(--muted); text-decoration: none; display: flex; align-items: center; gap: 5px; transition: color 0.2s; }
.back-link:hover { color: var(--text); }

.page { padding: 3rem 1.5rem; max-width: 560px; margin: 0 auto; }
.page-header { margin-bottom: 2rem; }
.eyebrow {
  font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--accent-b); margin-bottom: 0.75rem; display: block;
}
h1 { font-family: var(--font-head); font-size: 1.9rem; font-weight: 800; line-height: 1.15; margin-bottom: 0.5rem; }
.sub { color: var(--muted); font-size: 14px; }

.form-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 2rem;
}
.fields { display: flex; flex-direction: column; gap: 1.25rem; }
.field { display: flex; flex-direction: column; gap: 7px; }
.label {
  font-size: 11px; font-weight: 500; letter-spacing: 0.07em;
  text-transform: uppercase; color: var(--muted);
}
.input {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text);
  font-family: var(--font-body); font-size: 14px;
  padding: 11px 14px; outline: none; width: 100%;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.input:focus { border-color: var(--accent-b); box-shadow: 0 0 0 3px rgba(59,130,246,0.12); }
.input::placeholder { color: var(--muted); }

.btn-submit {
  width: 100%; padding: 13px; margin-top: 0.5rem;
  background: var(--accent-b); color: #fff;
  border: none; border-radius: var(--radius);
  font-family: var(--font-body); font-size: 15px; font-weight: 500;
  cursor: pointer; transition: opacity 0.2s, transform 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.btn-submit:hover { opacity: 0.88; transform: translateY(-1px); }
.btn-submit:active { transform: translateY(0); }

.form-footer { text-align: center; margin-top: 1.5rem; font-size: 12px; color: var(--muted); }

.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
@media (max-width: 480px) { .row-2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<nav>
  <div class="brand">🌍 Tourist<span>Safe</span></div>
  <a href="/" class="back-link">← Home</a>
</nav>

<div class="page">
  <div class="page-header">
    <span class="eyebrow">Step 1 of 1</span>
    <h1>Tourist Registration</h1>
    <p class="sub">Register to receive safety alerts and emergency assistance during your visit.</p>
  </div>

  <div class="form-card">
    <form method="POST">
      {% csrf_token %}
      <div class="fields">
        <div class="field">
          <label class="label" for="name">Full Name</label>
          <input class="input" type="text" id="name" name="name" placeholder="e.g. Priya Sharma" required>
        </div>
        <div class="row-2">
          <div class="field">
            <label class="label" for="email">Email Address</label>
            <input class="input" type="email" id="email" name="email" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label class="label" for="phone">Phone Number</label>
            <input class="input" type="text" id="phone" name="phone" placeholder="+91 98765 43210" required>
          </div>
        </div>
        <div class="field">
          <label class="label" for="country">Country of Origin</label>
          <input class="input" type="text" id="country" name="country" placeholder="e.g. United Kingdom" required>
        </div>
        <button type="submit" class="btn-submit">
          Register →
        </button>
      </div>
    </form>
  </div>

  <p class="form-footer">Your data is protected and only shared with emergency authorities when necessary.</p>
</div>

</body>
</html>
