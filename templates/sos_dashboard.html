{% extends "base.html" %}

{% block title %}SOS Emergency Live Pins Map - SafeGuard AI{% endblock %}

{% block content %}
<div style="margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
    <div>
        <h1 class="page-title"><i class="fa-solid fa-map-pin" style="color: var(--accent-red);"></i> SOS Live Emergency Pins</h1>
        <p class="page-subtitle" style="margin-bottom: 0;">Real-time geographical map plotting all active emergency broadcasts.</p>
    </div>
    <div class="badge badge-high" style="font-size: 0.85rem; padding: 8px 16px;">
        <i class="fa-solid fa-bell" style="animation: pulseGlow 1.5s infinite;"></i> SOS Live Monitoring Feed Active
    </div>
</div>

<div class="glass-card sos-card-accent" style="padding: 1rem; margin-bottom: 2rem;">
    <div id="map" class="map-container" style="height: 620px;"></div>
</div>
{% endblock %}

{% block extra_js %}
<script>
var map = L.map('map').setView([22.9734, 78.6569], 5);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

function loadSOS(){
  fetch("/sos-data/")
    .then(response => response.json())
    .then(data => {
      data.forEach(function(alert){
        var marker = L.marker([alert.lat, alert.lng]).addTo(map);
        marker.bindPopup(
          "<div style='color:#0f172a;'><strong><i class='fa-solid fa-bell' style='color:#ef4444;'></i> Tourist:</strong> " + alert.user + "<br>" +
          "<strong>Latitude:</strong> " + alert.lat + "<br>" +
          "<strong>Longitude:</strong> " + alert.lng + "<br><br>" +
          "<a href='https://www.google.com/maps?q=" + alert.lat + "," + alert.lng + "' target='_blank' style='color:#3b82f6; font-weight:bold;'>Open Directions</a></div>"
        );
      });
    });
}

loadSOS();
</script>
{% endblock %}
