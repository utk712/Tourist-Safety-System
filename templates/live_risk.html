<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Risk Detection</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0f1e; --surface: #111827; --surface2: #1a2235;
  --border: rgba(255,255,255,0.07); --border-md: rgba(255,255,255,0.13);
  --text: #f0f4ff; --muted: #7a8aaa;
  --accent-r: #ff3b5c; --accent-b: #3b82f6; --accent-g: #22c55e; --accent-o: #f97316;
  --radius: 12px; --radius-lg: 18px;
  --font-head: 'Syne', sans-serif; --font-body: 'DM Sans', sans-serif;
}
html, body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; }
nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1rem 2rem; border-bottom: 1px solid var(--border);
  background: rgba(10,15,30,0.9); backdrop-filter: blur(12px);
  position: sticky; top: 0; z-index: 100;
}
.brand { font-family: var(--font-head); font-weight: 800; font-size: 1.05rem; }
.brand span { color: var(--accent-b); }
.back-link { font-size: 13px; color: var(--muted); text-decoration: none; transition: color 0.2s; }
.back-link:hover { color: var(--text); }

.page { padding: 3rem 1.5rem; max-width: 560px; margin: 0 auto; text-align: center; }
h1 { font-family: var(--font-head); font-size: 1.9rem; font-weight: 800; margin-bottom: 0.5rem; }
.sub { color: var(--muted); font-size: 14px; margin-bottom: 2.5rem; }

.check-btn {
  padding: 15px 36px; border-radius: var(--radius);
  background: var(--accent-b); color: #fff;
  border: none; font-family: var(--font-head); font-size: 1rem; font-weight: 700;
  cursor: pointer; transition: opacity 0.2s, transform 0.15s;
  letter-spacing: 0.03em; margin-bottom: 2.5rem;
}
.check-btn:hover { opacity: 0.88; transform: translateY(-1px); }
.check-btn:active { transform: translateY(0); }
.check-btn:disabled { opacity: 0.5; cursor: default; transform: none; }

/* RESULT CARD */
.result-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 2rem 1.5rem;
  display: none;
}
.result-card.visible { display: block; }

.coord-display {
  display: flex; gap: 12px; margin-bottom: 1.5rem;
}
.coord-box {
  flex: 1; background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 14px; text-align: left;
}
.coord-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 3px; }
.coord-val { font-size: 14px; font-family: 'Courier New', monospace; color: var(--text); }

.divider { height: 1px; background: var(--border); margin: 1.25rem 0; }

.risk-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 10px; }
.risk-badge {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 22px; border-radius: 100px;
  font-family: var(--font-head); font-size: 1.2rem; font-weight: 700;
}
.risk-high   { background: rgba(255,59,92,0.12);  color: var(--accent-r); border: 1px solid rgba(255,59,92,0.25); }
.risk-medium { background: rgba(249,115,22,0.12); color: var(--accent-o); border: 1px solid rgba(249,115,22,0.25); }
.risk-low    { background: rgba(34,197,94,0.12);  color: var(--accent-g); border: 1px solid rgba(34,197,94,0.25); }

.spinner {
  display: inline-block; width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.15); border-top-color: var(--accent-b);
  border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<nav>
  <div class="brand">🌍 Tourist<span>Safe</span></div>
  <a href="/" class="back-link">← Home</a>
</nav>

<div class="page">
  <h1>📍 Live Risk Detection</h1>
  <p class="sub">Check the current safety risk level at your GPS location in real time.</p>

  <button class="check-btn" id="checkBtn" onclick="getLocation()">Check My Safety</button>

  <div class="result-card" id="resultCard">
    <div class="coord-display">
      <div class="coord-box">
        <div class="coord-label">Latitude</div>
        <div class="coord-val" id="latDisplay">—</div>
      </div>
      <div class="coord-box">
        <div class="coord-label">Longitude</div>
        <div class="coord-val" id="lngDisplay">—</div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="risk-label">Current Risk Level</div>
    <div id="riskOutput"></div>
  </div>
</div>

<script>
function getLocation() {
  var btn = document.getElementById('checkBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Detecting…';

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(showPosition, function() {
      btn.disabled = false;
      btn.innerHTML = 'Check My Safety';
      alert('Location access denied. Please enable GPS.');
    });
  } else {
    alert("Geolocation not supported");
    btn.disabled = false;
    btn.innerHTML = 'Check My Safety';
  }
}

function showPosition(position) {
  var lat = position.coords.latitude;
  var lng = position.coords.longitude;

  document.getElementById("latDisplay").textContent = lat.toFixed(6);
  document.getElementById("lngDisplay").textContent = lng.toFixed(6);

  var btn = document.getElementById('checkBtn');
  btn.innerHTML = '<span class="spinner"></span>Analysing risk…';

  fetch(`/risk-check/?city=Mumbai&hour=22`)
    .then(response => response.json())
    .then(data => {
      var level = data.risk_level;
      var cls = level === 'High' ? 'risk-high' : (level === 'Medium' ? 'risk-medium' : 'risk-low');
      var icon = level === 'High' ? '🔴' : (level === 'Medium' ? '🟠' : '🟢');
      document.getElementById("riskOutput").innerHTML =
        '<div class="risk-badge ' + cls + '">' + icon + ' ' + level + ' Risk</div>';
      document.getElementById("resultCard").classList.add('visible');
      btn.disabled = false;
      btn.innerHTML = 'Check Again';
    })
    .catch(function() {
      btn.disabled = false;
      btn.innerHTML = 'Check My Safety';
    });
}
</script>
</body>
</html>
