<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Incident</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0f1e; --surface: #111827; --surface2: #1a2235;
  --border: rgba(255,255,255,0.07); --border-md: rgba(255,255,255,0.13);
  --text: #f0f4ff; --muted: #7a8aaa;
  --accent-b: #3b82f6; --accent-y: #f59e0b;
  --radius: 12px; --radius-lg: 18px;
  --font-head: 'Syne', sans-serif; --font-body: 'DM Sans', sans-serif;
}
html, body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; }

nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1rem 2rem; border-bottom: 1px solid var(--border);
  background: rgba(10,15,30,0.9); backdrop-filter: blur(12px);
  position: sticky; top: 0; z-index: 100;
}
.brand { font-family: var(--font-head); font-weight: 800; font-size: 1.05rem; }
.brand span { color: var(--accent-b); }
.back-link { font-size: 13px; color: var(--muted); text-decoration: none; display: flex; align-items: center; gap: 5px; transition: color 0.2s; }
.back-link:hover { color: var(--text); }

.page { padding: 3rem 1.5rem; max-width: 580px; margin: 0 auto; }
.page-header { margin-bottom: 2rem; }
.eyebrow {
  font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--accent-y); margin-bottom: 0.75rem; display: block;
}
h1 { font-family: var(--font-head); font-size: 1.9rem; font-weight: 800; line-height: 1.15; margin-bottom: 0.5rem; }
.sub { color: var(--muted); font-size: 14px; }

.info-banner {
  display: flex; align-items: flex-start; gap: 10px;
  background: rgba(245,158,11,0.07); border: 1px solid rgba(245,158,11,0.18);
  border-radius: var(--radius); padding: 12px 16px; margin-bottom: 1.75rem;
  font-size: 13px; color: #fbbf24; line-height: 1.55;
}

.form-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 2rem;
}
.fields { display: flex; flex-direction: column; gap: 1.25rem; }
.field { display: flex; flex-direction: column; gap: 7px; }
.label {
  font-size: 11px; font-weight: 500; letter-spacing: 0.07em;
  text-transform: uppercase; color: var(--muted);
}
.input, .textarea {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text);
  font-family: var(--font-body); font-size: 14px;
  padding: 11px 14px; outline: none; width: 100%;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.input:focus, .textarea:focus { border-color: var(--accent-y); box-shadow: 0 0 0 3px rgba(245,158,11,0.1); }
.input::placeholder, .textarea::placeholder { color: var(--muted); }
.textarea { resize: vertical; min-height: 110px; line-height: 1.6; }

.char-hint { font-size: 11px; color: var(--muted); text-align: right; }

.btn-submit {
  width: 100%; padding: 13px; margin-top: 0.25rem;
  background: var(--accent-y); color: #1a0f00;
  border: none; border-radius: var(--radius);
  font-family: var(--font-body); font-size: 15px; font-weight: 600;
  cursor: pointer; transition: opacity 0.2s, transform 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.btn-submit:hover { opacity: 0.88; transform: translateY(-1px); }
.btn-submit:active { transform: translateY(0); }
</style>
</head>
<body>

<nav>
  <div class="brand">🌍 Tourist<span>Safe</span></div>
  <a href="/" class="back-link">← Home</a>
</nav>

<div class="page">
  <div class="page-header">
    <span class="eyebrow">⚠ Safety Report</span>
    <h1>Report an Incident</h1>
    <p class="sub">Submit a report to alert local authorities. All reports are reviewed promptly.</p>
  </div>

  <div class="info-banner">
    <span>⚡</span>
    <span>If you are in immediate danger, use <a href="/sos/" style="color: #f59e0b; font-weight: 600;">Emergency SOS</a> instead of this form.</span>
  </div>

  <div class="form-card">
    <form method="POST">
      {% csrf_token %}
      <div class="fields">
        <div class="field">
          <label class="label" for="tourist_name">Your Name</label>
          <input class="input" type="text" id="tourist_name" name="tourist_name" placeholder="Full name as registered" required>
        </div>
        <div class="field">
          <label class="label" for="location">Incident Location</label>
          <input class="input" type="text" id="location" name="location" placeholder="Street, landmark, or area name">
        </div>
        <div class="field">
          <label class="label" for="description">Incident Description</label>
          <textarea class="textarea" id="description" name="description" placeholder="Describe what happened in as much detail as possible — time, people involved, what occurred..." required></textarea>
          <span class="char-hint">Be as specific as possible to help authorities respond effectively.</span>
        </div>
        <button type="submit" class="btn-submit">
          Submit Report →
        </button>
      </div>
    </form>
  </div>
</div>

</body>
</html>
